[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "traceguard-research"
version = "0.1.0"
description = "Reproducibility artifact for trace-reconstruction attacks and trace-private defenses for confidential LLM agents"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Apache-2.0" }
authors = [{ name = "Artifact authors to be supplied before publication" }]
keywords = ["llm-agents", "privacy", "side-channels", "reproducibility", "medical-ai"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]
dependencies = [
  "cryptography>=45,<48",
  "fastapi>=0.116,<1",
  "langgraph>=1,<2",
  "numpy>=2,<3",
  "openai==2.46.0",
  "scikit-learn>=1.7,<2",
  "scipy>=1.16,<2",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "matplotlib>=3.9,<4",
  "pytest>=8.4,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.12,<1",
]

[project.scripts]
traceguard = "traceguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
traceguard = ["data/*.json", "data/*.md", "web/*.html", "web/*.css", "web/*.js"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]
